<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Samarian Group</title>
  <meta name="description" content="Samarian Group is a private family office. By referral only.">
  <meta name="theme-color" content="#050707">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050707;
      --cream: #fdf4e3;
      --muted: #a59e94;
      --line: rgba(253, 244, 227, 0.12);
      --horizon: 74%;
      --logo-w: min(420px, 78vw);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--cream);
      font-family: "Jost", "Helvetica Neue", Arial, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100svh;
      padding: 0 24px;
    }

    /* Background: night sea, a glow on the horizon and a slow sweep of light */
    .scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .scene > * { position: absolute; }

    /* --mx / --my (-1..1) follow the pointer, set by the script below */
    .scene { --mx: 0; --my: 0; }

    .sky {
      inset: 0;
      background:
        radial-gradient(70% 38% at calc(50% + var(--mx) * 18%) var(--horizon), rgba(255, 255, 255, calc(0.085 + var(--my) * 0.025)), transparent 70%),
        linear-gradient(180deg, #030404 0%, #0b0e0e calc(var(--horizon) - 2%), #040505 calc(var(--horizon) + 1%), #020303 100%);
      animation: breathe 14s ease-in-out infinite alternate;
    }


    .horizon-glow {
      left: 0;
      right: 0;
      top: var(--horizon);
      height: 46px;
      transform: translateY(-50%);
      background: radial-gradient(50% 50% at 50% 50%, rgba(255, 255, 255, 0.16), transparent 70%);
      filter: blur(10px);
      translate: calc(var(--mx) * 14vw) 0;
      animation: pulse 9s ease-in-out infinite alternate, glide 26s ease-in-out infinite alternate;
    }

    .sweep {
      left: 18%;
      top: var(--horizon);
      width: 95vmax;
      height: 9vmax;
      transform-origin: 0 50%;
      transform: rotate(24deg);
      background: radial-gradient(50% 50% at 38% 50%, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.06) 45%, transparent 72%);
      filter: blur(16px);
      translate: calc(var(--mx) * 4vw) calc(var(--my) * 1.5vh);
      rotate: calc(var(--mx) * 3deg);
      animation: drift 22s ease-in-out infinite alternate;
    }

    .shore {
      left: -30%;
      top: calc(var(--horizon) - 1px);
      width: 75%;
      height: 120%;
      background: #020303;
      border-top-right-radius: 100% 22%;
      filter: blur(3px);
      translate: calc(var(--mx) * -1.5vw) 0;
      animation: sway 30s ease-in-out infinite alternate;
    }

    .grain {
      inset: -50%;
      opacity: 0.16;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      animation: grain 1.2s steps(4) infinite;
    }

    .vignette {
      inset: 0;
      background: radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0, 0, 0, 0.75) 100%);
    }

    @keyframes breathe { from { opacity: 0.85; } to { opacity: 1; } }
    @keyframes pulse { from { opacity: 0.65; } to { opacity: 1; } }
    @keyframes drift {
      from { transform: rotate(23deg) translateX(-2%); opacity: 0.7; }
      to { transform: rotate(26deg) translateX(3%); opacity: 1; }
    }
    @keyframes glide {
      from { transform: translate(-7vw, -50%); }
      to { transform: translate(7vw, -50%); }
    }
    @keyframes sway {
      from { transform: translate(-1.2vw, 0.5vh); }
      to { transform: translate(1.2vw, -0.3vh); }
    }
    @keyframes float { from { translate: 0 0; } to { translate: 0 -5px; } }
    @keyframes grain {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-3%, 2%); }
      50% { transform: translate(2%, -3%); }
      75% { transform: translate(-2%, -1%); }
      100% { transform: translate(0, 0); }
    }

    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 0;
    }

    .logo img { width: var(--logo-w); height: auto; display: block; }

    .about {
      margin-top: 64px;
      width: var(--logo-w); /* same width as the logo */
      font-size: 14px;
      line-height: 1.85;
      color: var(--cream);
    }

    .about em {
      display: block;
      margin-top: 18px;
      font-style: normal;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--cream);
    }

    footer {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 40px;
      padding: 28px 0 36px;
      border-top: 1px solid var(--line);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    footer a, footer span { color: var(--cream); text-decoration: none; }
    footer a { transition: color .2s ease; }
    footer a:hover { color: var(--muted); }

    main > * { opacity: 0; animation: rise 1.2s ease forwards, float 12s ease-in-out 1.2s infinite alternate; }
    .about { animation-delay: .25s, 3s; }
    footer { opacity: 0; animation: rise 1.2s ease .45s forwards; }
    .scene { opacity: 0; animation: fade 2.4s ease forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes fade { to { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      main > *, footer, .scene, .scene > * { animation: none; opacity: 1; }
    }

    @media (max-width: 600px) {
      :root { --horizon: 78%; --logo-w: min(336px, 62.4vw); }
      main { padding: 40px 0; }
      .about { margin-top: 44px; font-size: 13.5px; }
      footer { flex-direction: column; align-items: center; gap: 12px; }
      .sweep { left: 6%; width: 140vmax; }
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="sky"></div>
    <div class="horizon-glow"></div>
    <div class="shore"></div>
    <div class="sweep"></div>
    <div class="grain"></div>
    <div class="vignette"></div>
  </div>

  <main>
    <h1 class="logo">
      <img src="assets/logo.webp" alt="Samarian" width="2000" height="221">
    </h1>

    <p class="about">
      Samarian Group is a private family office. We back founders for the long term, and for a small circle of families, we open doors and help navigate the conversations that matter most.
      <em>By referral only.</em>
    </p>
  </main>

  <!-- PLACEHOLDER CONTACT: replace with real details -->
  <footer>
    <a href="mailto:info@samariangroup.com">info@samariangroup.com</a>
    <span>New York, NY</span>
  </footer>

  <script>
    // Ease the light toward the pointer
    (() => {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const scene = document.querySelector(".scene");
      let tx = 0, ty = 0, x = 0, y = 0, raf = 0;

      const tick = () => {
        x += (tx - x) * 0.04;
        y += (ty - y) * 0.04;
        scene.style.setProperty("--mx", x.toFixed(4));
        scene.style.setProperty("--my", y.toFixed(4));
        raf = Math.abs(tx - x) + Math.abs(ty - y) > 0.001 ? requestAnimationFrame(tick) : 0;
      };

      const aim = (nx, ny) => {
        tx = nx; ty = ny;
        if (!raf) raf = requestAnimationFrame(tick);
      };

      addEventListener("pointermove", e => aim(e.clientX / innerWidth * 2 - 1, e.clientY / innerHeight * 2 - 1));
      document.addEventListener("pointerleave", () => aim(0, 0));
    })();
  </script>
</body>
</html>
